<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AppTravel Group CRM</title>
<meta name="description" content="Protótipo navegável do CRM da agência: o lead gerado pelo grupo no app vira negócio, proposta, viagem e pós-venda.">
<meta property="og:title" content="AppTravel Group CRM">
<meta property="og:description" content="Protótipo navegável do CRM da agência, conectado ao app do grupo.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Desktop CRM: menu lateral + área de trabalho; painel de validação à direita */
:root{
  --roxo:#5B3DF5; --roxo2:#4A2FD6; --roxo-c:#F0ECFF; --coral:#FF7A6B;
  --ink:#1E1840; --ink2:#3F3A5A; --muted:#625D7C; --line:#ECE8F6; --line2:#E4DFF5;
  --bg:#F5F3FB; --card:#FFFFFF;
  --verde:#0E6B4C; --verde-c:#E4F7EE; --verm:#B42318; --verm-c:#FDECEC; --amar:#7A4B00; --amar-c:#FFF4D6; --azul:#1D4ED8; --azul-c:#E6EEFF;
  --disp:'Bricolage Grotesque','Plus Jakarta Sans',system-ui,sans-serif; --txt:'Plus Jakarta Sans',system-ui,sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--txt)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--roxo)}
h1,h2,h3{font-family:var(--disp);margin:0;letter-spacing:-.3px}
:focus-visible{outline:3px solid #BFB2FF;outline-offset:2px}
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.app.guia-on{grid-template-columns:248px 1fr 340px}
/* menu */
.side{background:#fff;border-right:1px solid var(--line);padding:16px 12px;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 12px}
.brand .lg{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#7B5CFF,#FF7A6B);display:flex;align-items:center;justify-content:center}
.brand b{font-family:var(--disp);font-size:16px;line-height:18px}
.brand span{display:block;font-size:11px;color:var(--muted);font-weight:600}
.criar{margin:4px 4px 10px;height:40px;border:none;border-radius:12px;background:linear-gradient(135deg,#7B5CFF,#4A2FD6);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 8px 18px rgba(91,61,245,.25)}
.grp{font-size:11px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);padding:12px 10px 4px}
.nav{display:flex;align-items:center;gap:10px;width:100%;border:none;background:transparent;text-align:left;padding:8px 10px;border-radius:10px;font-weight:600;color:var(--ink2)}
.nav:hover{background:#F6F4FC}
.nav.on{background:var(--roxo-c);color:var(--roxo2);font-weight:800}
.nav img{width:20px;height:20px;flex:none}
.nav .cnt{margin-left:auto;background:var(--coral);color:#fff;font-size:11px;font-weight:800;border-radius:999px;padding:1px 7px}
.side .rodape{margin-top:auto;padding:10px;font-size:11px;color:var(--muted)}
/* topo */
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:5;background:rgba(245,243,251,.92);backdrop-filter:blur(6px);display:flex;align-items:center;gap:12px;padding:12px 28px;border-bottom:1px solid var(--line)}
.busca{flex:1;max-width:520px;display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line2);border-radius:12px;padding:0 12px;height:40px;color:var(--muted)}
.busca input{border:none;outline:none;flex:1;background:transparent}
.ib{width:40px;height:40px;border-radius:12px;border:1px solid var(--line2);background:#fff;display:flex;align-items:center;justify-content:center;position:relative}
.ib .bd{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;border-radius:999px;background:#E8445A;color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 4px}
.user{display:flex;align-items:center;gap:8px;font-weight:700}
.av{width:34px;height:34px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex:none;background:var(--roxo-c);color:var(--roxo2)}
.av.sm{width:26px;height:26px;font-size:11px}
.content{padding:24px 28px 60px;max-width:1280px;width:100%}
/* cabeçalhos de página */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.ph h1{font-size:26px}
.ph p{margin:4px 0 0;color:var(--muted)}
.crumb{font-size:12px;color:var(--muted);font-weight:700;margin-bottom:4px}
.crumb button{border:none;background:none;padding:0;color:var(--roxo);font-weight:700}
/* botões */
.btn{height:38px;padding:0 16px;border-radius:10px;border:1px solid var(--line2);background:#fff;font-weight:700;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn:hover{border-color:#CFC4FF}
.btn.p{background:linear-gradient(135deg,#7B5CFF,#4A2FD6);border-color:transparent;color:#fff;box-shadow:0 6px 14px rgba(91,61,245,.22)}
.btn.ok{background:var(--verde);border-color:var(--verde);color:#fff}
.btn.dg{color:var(--verm);border-color:#F5C2C0}
.btn.sm{height:30px;padding:0 10px;font-size:12px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.lk{border:none;background:none;color:var(--roxo);font-weight:700;padding:0}
/* cartões e grades */
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px}
.card h3{font-size:16px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.col{display:flex;flex-direction:column;gap:16px}
.row{display:flex;align-items:center;gap:10px}
.sp{justify-content:space-between}
.muted{color:var(--muted)}
.sm{font-size:12px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;white-space:nowrap}
.p-roxo{background:var(--roxo-c);color:var(--roxo2)}.p-verde{background:var(--verde-c);color:var(--verde)}.p-verm{background:var(--verm-c);color:var(--verm)}.p-amar{background:var(--amar-c);color:var(--amar)}.p-cinza{background:#F1EEF8;color:var(--muted)}.p-azul{background:var(--azul-c);color:var(--azul)}.p-coral{background:#FFE9E4;color:#B4381F}
.kpi{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px;border-left:4px solid var(--roxo)}
.kpi .k{font-size:12px;color:var(--muted);font-weight:700}
.kpi .v{font-family:var(--disp);font-size:26px;font-weight:800;margin-top:2px}
.kpi .d{font-size:12px;color:var(--muted)}
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line)}
.tbl td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr.cl{cursor:pointer}
.tbl tr.cl:hover td{background:#FAF8FF}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:8px;background:#EDE9F7;overflow:hidden}
.bar>div{height:8px;border-radius:8px;background:linear-gradient(90deg,#7B5CFF,#FF7A8A)}
.vazio{text-align:center;color:var(--muted);padding:28px 10px}
/* kanban */
.kb{display:flex;gap:12px;overflow-x:auto;padding-bottom:10px;align-items:flex-start}
.kc{flex:0 0 215px;background:#EFECF8;border-radius:16px;padding:10px}
.kc .kh{display:flex;align-items:center;justify-content:space-between;padding:4px 4px 10px;font-weight:800}
.kc .kh small{font-weight:700;color:var(--muted)}
.kcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px;cursor:pointer;border-top:3px solid var(--roxo)}
.kcard:hover{box-shadow:0 6px 16px rgba(42,27,110,.10)}
.kcard b{display:block;font-size:13px;line-height:17px}
.kcard .meta{font-size:12px;color:var(--muted);margin-top:6px;display:flex;flex-direction:column;gap:3px}
.kcard .prox{margin-top:8px;font-size:12px;padding:6px 8px;border-radius:8px;background:#F6F4FC}
.kcard .prox.late{background:var(--verm-c);color:var(--verm)}
/* formulários */
label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:700;color:var(--ink2)}
.inp{height:40px;border:1px solid var(--line2);border-radius:10px;padding:0 12px;background:#fff;min-width:0}
textarea.inp{height:auto;min-height:90px;padding:10px 12px;resize:vertical}
.inp:focus{outline:3px solid #DCD3FF;border-color:var(--roxo)}
.chk{display:flex;align-items:center;gap:8px;font-weight:600}
.chk input{width:18px;height:18px;accent-color:var(--roxo)}
/* stepper */
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.st{display:flex;align-items:center;gap:8px;border:1px solid var(--line2);background:#fff;border-radius:999px;padding:6px 12px 6px 6px;font-weight:700;font-size:12px;color:var(--muted)}
.st .n{width:24px;height:24px;border-radius:999px;background:#EDE9F7;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px}
.st.on{border-color:var(--roxo);color:var(--roxo2)}
.st.on .n{background:var(--roxo);color:#fff}
.st.ok .n{background:var(--verde);color:#fff}
.edbar{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 0;margin-top:18px;display:flex;justify-content:space-between;gap:10px}
/* fotos */
.ph-img{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:12px;display:block;background:#EDE9F7}
.ex{border:2px solid var(--line);border-radius:14px;overflow:hidden;background:#fff}
.ex.sel{border-color:var(--roxo)}
.ex .b{padding:10px 12px}
/* drawer, modal, toast */
.guia{background:#fff;border-left:1px solid var(--line);position:sticky;top:0;height:100vh;overflow-y:auto;padding:18px 16px}
.passo{display:flex;gap:10px;padding:10px;border-radius:12px;align-items:flex-start}
.passo.atual{background:var(--roxo-c)}
.passo .c{width:24px;height:24px;border-radius:999px;border:2px solid var(--line2);flex:none;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:var(--muted)}
.passo.feito .c{background:var(--verde);border-color:var(--verde);color:#fff}
.passo b{display:block;font-size:13px}
.passo span{font-size:12px;color:var(--muted)}
.ov{position:fixed;inset:0;background:rgba(30,20,70,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:#fff;border-radius:20px;max-width:640px;width:100%;max-height:90vh;overflow-y:auto;padding:22px;box-shadow:0 30px 60px rgba(20,10,60,.3)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-weight:700;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:90vw}
.notif{position:absolute;right:0;top:48px;width:380px;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 20px 40px rgba(42,27,110,.18);padding:8px;z-index:20}
.notif .it{display:flex;gap:10px;padding:10px;border-radius:10px;cursor:pointer;text-align:left;border:none;background:none;width:100%}
.notif .it:hover{background:#F6F4FC}
.notif .it.nova{background:#FFF6F2}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;flex-wrap:wrap}
.tab{border:none;background:none;padding:10px 14px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--roxo2);border-bottom-color:var(--roxo)}
.app-ban{display:flex;gap:12px;align-items:center;background:linear-gradient(135deg,#F0ECFF,#FFF1EC);border:1px solid #E4DCFF;border-radius:16px;padding:14px 16px}
.chip-pessoa{display:inline-flex;align-items:center;gap:6px;background:#F6F4FC;border-radius:999px;padding:3px 10px 3px 3px;font-size:12px;font-weight:700}
.dia{border-left:3px solid var(--roxo);padding:2px 0 2px 14px;margin-bottom:14px}
.ativ{display:flex;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.ativ:last-child{border-bottom:none}
.ativ .h{min-width:52px;font-weight:800;color:var(--roxo2)}
.star{width:18px;height:18px}
@media (max-width:1180px){.app.guia-on{grid-template-columns:220px 1fr}.app.guia-on .guia{position:fixed;right:0;top:0;width:340px;z-index:40;box-shadow:-10px 0 30px rgba(0,0,0,.12)}}
@media (max-width:900px){
  .app,.app.guia-on{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;overflow-x:auto}
  .side .grp,.side .rodape{display:none}
  .g2,.g3,.g4{grid-template-columns:1fr}
  .content{padding:16px}
  .top{padding:10px 16px}
  .top .busca,.top .user>div{display:none}
  .card{overflow-x:auto}
  .ph,.ph .row{flex-wrap:wrap}
  .aviso-pc{display:block!important}
}
.aviso-pc{display:none;background:#FFF4D6;color:#7A4B00;font-size:13px;font-weight:600;padding:10px 16px;border-bottom:1px solid #F1D99A}
@media (prefers-reduced-motion:no-preference){.kcard,.btn,.nav{transition:background .15s,box-shadow .15s,border-color .15s}}
</style>
</head>

      <tr><td colspan="3"><b>Custo total</b></td><td class="num"><b>${brl(C.custo)}</b></td></tr></tbody></table></div>

function despesasViagem(v) {
  const L = lead('L-1042'); const ds = v.despesas || [];
  if (!v.app) return '<div class="card vazio">Este grupo não usa o app: as despesas do grupo não se aplicam.</div>';

}
function cobranca(v) {
  if (!v.valor) return '';
  const par = 10; const ent = Math.round(v.valor * 0.3); const resto = v.valor - ent; const pv = resto / (par - 1);
  const linhas = [{ t: 'Entrada (30%)', d: 'no aceite', val: ent, ok: true }].concat(Array.from({ length: par - 1 }, (x, i) => ({ t: 'Parcela ' + (i + 2) + ' de ' + par, d: 'dia 10/' + String(((11 + i) % 12) + 1).padStart(2, '0'), val: pv, ok: false })));
  return `<div class="card"><h3>${ic('moneybag', 22)} Cobrança da agência</h3><p class="sm muted">Controle do que o cliente paga à agência pelo pacote (o rateio entre o grupo fica em "Despesas do grupo").</p>
    <table class="tbl"><thead><tr><th>Parcela</th><th>Vencimento</th><th class="num">Valor</th><th>Situação</th></tr></thead><tbody>${linhas.slice(0, 5).map((l) => `<tr><td>${l.t}</td><td>${l.d}</td><td class="num">${brl2(l.val)}</td><td>${l.ok ? '<span class="pill p-verde">Recebida</span>' : '<span class="pill p-cinza">A receber</span>'}</td></tr>`).join('')}<tr><td colspan="4" class="sm muted">+ ${par - 5} parcelas</td></tr></tbody></table></div>`;
}
function telaDespesas() {
  const vs = S.viagens.filter((v) => v.app);
  return `<div class="ph"><div><h1>Despesas e cobrança</h1><p>Despesas que a agência lança para os grupos no app e o que cada cliente paga à agência.</p></div></div>

/* ---------- Metas, clientes, tarefas, reputação ---------- */
function telaMetas() {
  const ganhos = S.negocios.filter((n) => n.etapa === 'ganho'); const tot = ganhos.reduce((a, n) => a + n.valor, 0); const meta = 90000;
  const abertos = S.negocios.filter((n) => !['ganho', 'perdido'].includes(n.etapa)); const prev = abertos.reduce((a, n) => a + n.valor * ETAPAS.find((e) => e.id === n.etapa).prob / 100, 0);
  const app = S.negocios.filter((n) => n.origem === 'App'); const outros = S.negocios.filter((n) => n.origem !== 'App');
  const taxa = (arr) => { const f = arr.filter((n) => ['ganho', 'perdido'].includes(n.etapa)); return f.length ? Math.round(f.filter((n) => n.etapa === 'ganho').length / f.length * 100) : 0; };
  return `<div class="ph"><div><h1>Metas e resultados</h1><p>Uma única fonte de verdade: os negócios do funil. Outubro de 2026.</p></div></div>
    <div class="card"><div class="row sp"><h3>Meta de outubro: ${brl(meta)}</h3><span class="pill ${tot >= meta ? 'p-verde' : 'p-amar'}">${Math.round(tot / meta * 100)}% atingido</span></div><div class="bar" style="height:14px"><div style="height:14px;width:${Math.min(100, tot / meta * 100)}%"></div></div>
      <div class="g4" style="margin-top:14px"><div class="kpi" style="border-left-color:var(--verde)"><div class="k">Ganho</div><div class="v">${brl(tot)}</div><div class="d">${ganhos.length} vendas</div></div><div class="kpi"><div class="k">Falta</div><div class="v">${brl(Math.max(0, meta - tot))}</div><div class="d">1 dia útil no mês</div></div><div class="kpi" style="border-left-color:var(--azul)"><div class="k">Previsto ponderado</div><div class="v">${brl(prev)}</div><div class="d">abertos × chance da etapa</div></div><div class="kpi" style="border-left-color:var(--coral)"><div class="k">Se fechar o previsto</div><div class="v">${brl(tot + prev)}</div><div class="d">${tot + prev >= meta ? 'bate a meta' : 'ainda abaixo da meta'}</div></div></div></div>
    <div class="g2" style="margin-top:16px"><div class="card"><h3>Valor por etapa</h3>${ETAPAS.map((e) => { const v = S.negocios.filter((n) => n.etapa === e.id).reduce((a, n) => a + n.valor, 0); return `<div style="margin-bottom:10px"><div class="row sp sm"><b>${e.nome}</b><span>${brl(v)}</span></div><div class="bar"><div style="width:${Math.min(100, v / 60000 * 100)}%;background:${e.cor}"></div></div></div>`; }).join('')}</div>
      <div class="card"><h3>Leads do app contra outras origens</h3><table class="tbl"><thead><tr><th>Origem</th><th class="num">Negócios</th><th class="num">Valor</th><th class="num">Taxa de ganho</th></tr></thead><tbody><tr><td><span class="pill p-roxo">App</span></td><td class="num">${app.length}</td><td class="num">${brl(app.reduce((a, n) => a + n.valor, 0))}</td><td class="num">${taxa(app)}%</td></tr><tr><td>Outras</td><td class="num">${outros.length}</td><td class="num">${brl(outros.reduce((a, n) => a + n.valor, 0))}</td><td class="num">${taxa(outros)}%</td></tr></tbody></table><p class="sm muted">Números de exemplo do protótipo.</p></div></div>`;
}
function telaClientes() {
  const L = lead('L-1042'); const aceito = L.status === 'aceito';
  const grupos = [{ n: 'Família Rodrigues', p: L.pessoas.map((x) => x.n), app: true, viagens: aceito ? 1 : 0, ultima: aceito ? 'Roma e Florença' : '—', pass: 'válidos (4 de 4)' }, { n: 'Família Duarte', p: ['Renata Duarte', 'Caio Duarte', 'Bia Duarte', 'Leo Duarte'], app: true, viagens: 2, ultima: 'Paris', pass: '3 de 4 válidos' }, { n: 'Família Teixeira', p: ['Paulo Teixeira', '+4'], app: false, viagens: 1, ultima: 'Gramado', pass: '—' }];
  return `<div class="ph"><div><h1>Clientes e grupos</h1><p>O cliente viaja em grupo: aqui ficam as pessoas e os grupos com quem já viajaram.</p></div></div>
    <div class="card" style="padding:0"><table class="tbl"><thead><tr><th>Grupo</th><th>Pessoas</th><th>App</th><th>Viagens</th><th>Última</th><th>Passaportes</th></tr></thead><tbody>${grupos.map((g, i) => `<tr><td><b>${esc(g.n)}</b></td><td>${g.p.map((p, j) => `<span class="av sm" title="${esc(p)}" style="${AVC[j % 6]};margin-right:2px">${p[0] === '+' ? p : ini(p)}</span>`).join('')}</td><td>${g.app ? '<span class="pill p-verde">Conta no app</span>' : '<span class="pill p-cinza">Sem conta</span>'}</td><td>${g.viagens}</td><td>${esc(g.ultima)}</td><td class="sm">${esc(g.pass)}</td></tr>`).join('')}</tbody></table></div>
    <p class="sm muted" style="margin-top:8px">${ic('lock', 14, 'display:inline;vertical-align:-2px')} Documentos (CPF e passaporte) ficam mascarados na lista e só aparecem no detalhe, para quem tem permissão.</p>`;
}
function telaTarefas() {
  const g = [['atrasada', 'Atrasadas'], ['hoje', 'Hoje'], ['proximas', 'Próximas']];
  return `<div class="ph"><div><h1>Tarefas</h1><p>Situações simples (aberta ou concluída), com "atrasada" calculado sozinho. A automação cria tarefas a partir do que acontece no app.</p></div></div>
    <div class="g3">${g.map((x) => `<div class="card"><h3>${x[1]} (${S.tarefas.filter((t) => t.grupo === x[0] && !t.feito).length})</h3>${S.tarefas.filter((t) => t.grupo === x[0]).map((t) => tarefaLinha(t)).join('') || '<div class="vazio sm">Nada aqui</div>'}</div>`).join('')}</div>`;
}
function telaReputacao() {
  const m = S.avals.reduce((a, x) => a + x.n, 0) / S.avals.length;
  return `<div class="ph"><div><h1>Avaliações e ranking</h1><p>Nota dada pelos grupos no app depois da viagem quitada. Pagar não muda a posição no ranking.</p></div></div>
    <div class="g3" style="margin-bottom:16px"><div class="kpi" style="border-left-color:#E8A400"><div class="k">Nota média</div><div class="v">${m.toFixed(1).replace('.', ',')} ★</div><div class="d">${S.avals.length} avaliações</div></div><div class="kpi"><div class="k">Posição no ranking (exemplo)</div><div class="v">2º</div><div class="d">agências credenciadas em São Paulo</div></div><div class="kpi" style="border-left-color:var(--verde)"><div class="k">Grupos que voltaram</div><div class="v">${S.recompra ? 1 : 0}</div><div class="d">recompra pelo app</div></div></div>
    <div class="card">${S.avals.map((a) => `<div class="ativ"><span class="h" style="min-width:86px;color:#E8A400;letter-spacing:1px">${'★'.repeat(a.n)}<span style="color:#D9D4EA">${'★'.repeat(5 - a.n)}</span></span><div style="flex:1"><b>${esc(a.q)}</b> <span class="sm muted">· ${esc(a.d)}</span>${a.nova ? ' <span class="pill p-verde">Nova</span>' : ''}<div>${esc(a.t)}</div></div></div>`).join('')}</div>`;
}

/* ============================== AÇÕES ============================== */
const ACT = {
  go: (d) => go(d.t, d.id || null),
  goViagemAba: (d) => go('viagem', d.id, { aba: d.v }),
  aba: (d) => set({ aba: d.v }),
  guia: () => set({ guia: !S.guia }),
  notif: () => set({ notifOn: !S.notifOn }),
  lerTudo: () => { S.notifs.forEach((n) => { n.nova = false; }); render(); },
  abrirNotif: (d) => { const n = S.notifs.find((x) => x.id === d.id); n.nova = false; go(n.go[0], n.go[1]); },
  criar: () => set({ modal: 'criar' }),
  fechar: () => set({ modal: null }),
  reiniciar: () => { S = inicial(); render(); toast('Protótipo reiniciado'); },
  recusar: (d) => set({ modal: { tipo: 'recusar', id: d.id } }),
  confRecusar: (d) => { const l = lead(d.id); l.status = 'recusado'; S.modal = null; toast('Lead recusado. O grupo pode escolher outra agência no app; nada foi cobrado.'); go('leads'); },
  aceitar: (d) => {
    const l = lead(d.id); l.status = 'aceito';
    const nid = 'N-' + (210 + S.negocios.length);
    S.negocios.unshift({ id: nid, lead: l.id, titulo: l.titulo + ' · Família ' + l.contato.nome.split(' ').pop(), etapa: 'aceito', valor: l.valorEst, dono: 'Ana Souza', origem: 'App', abertura: '30/10/2026', pessoas: l.pessoas.length, prox: { t: 'Falar com o grupo em até 24 h', d: 'Hoje', late: false } });
    S.tarefas.unshift({ id: 'T' + Date.now(), t: 'Falar com o grupo em até 24 h · ' + l.titulo, ref: nid, quando: 'Hoje', grupo: 'hoje', feito: false, auto: true });
    ativ(nid, 'agora', 'Lead aceito por Ana Souza · grupo avisado no app');
    if (l.id === 'L-1042') marcar('p3');
    S.notifs.forEach((n) => { if (n.go[1] === l.id) n.nova = false; });
    go('negocio', nid); toast('Lead aceito: virou negócio no funil e o grupo foi avisado no app');
  },
  criarProp: (d) => { const n = neg(d.id); S.prop = novaProposta(n.id); n.etapa = 'montando'; n.prox = { t: 'Enviar a proposta ao grupo', d: 'Amanhã', late: false }; ativ(n.id, 'agora', 'Proposta criada a partir do roteiro do app'); marcar('p4'); go('editor'); toast('Proposta criada com destinos, datas e atrações do app'); },
  etapa: (d) => { S.prop.etapa = +d.v; if (+d.v >= 6) marcar('p5'); render(); window.scrollTo(0, 0); },
  importarVoos: () => { S.prop.voos[0].trechos = [{ r: 'GRU → FCO', c: 'Cia. aérea (exemplo) · voo noturno', d: '12/11', h: '23:55 → 15:50 (+1)', dur: '11h55' }, { r: 'FCO → GRU', c: 'Cia. aérea (exemplo)', d: '18/11', h: '22:10 → 05:40 (+1)', dur: '12h30' }]; render(); toast('IA leu 2 trechos e conferiu com as datas da viagem'); },
  selHotel: (d) => { const h = S.prop.hoteis.find((x) => x.id === d.id); S.prop.hoteis.forEach((x) => { if (x.cidade === h.cidade) x.sel = x.id === h.id; }); render(); },
  selExp: (d) => { const x = S.prop.exps[+d.id]; x.sel = !x.sel; render(); },
  selServ: (d) => { const x = S.prop.servicos[+d.id]; x.sel = !x.sel; render(); },
  capa: (d) => { S.prop.capa = d.v; render(); },
  canal: (d) => { S.prop[d.v] = !S.prop[d.v]; render(); },
  enviarProp: () => { const P = S.prop; const n = neg(P.neg); const C = propCalc(P); P.enviada = true; n.etapa = 'enviada'; n.valor = C.venda; n.prox = { t: 'Follow-up se o grupo não abrir em 2 dias', d: '01/11', late: false }; ativ(n.id, 'agora', 'Proposta enviada ao grupo no app' + (P.canalLink ? ' e por link' : '') + ' · ' + brl(C.venda)); S.tarefas.unshift({ id: 'T' + Date.now(), t: 'Follow-up se o grupo não abrir a proposta · Roma e Florença', ref: n.id, quando: '01/11', grupo: 'proximas', feito: false, auto: true }); marcar('p5'); marcar('p6'); go('negocio', n.id); toast('Proposta enviada: os 4 receberam o aviso no app'); },
  simAbriu: (d) => { ativ(d.id, 'agora', 'Flávio e Marta abriram a proposta no app'); S.notifs.unshift({ id: 'n' + Date.now(), t: 'Família Rodrigues abriu a proposta', s: 'Flávio e Marta viram Roma e Florença no app', nova: true, go: ['negocio', d.id], e: 'speech' }); render(); toast('O grupo abriu a proposta no app'); },
  simAceitou: (d) => { const n = neg(d.id); n.etapa = 'ganho'; n.fechamento = '30/10/2026'; ativ(n.id, 'agora', 'Flávio (cabeça do grupo) aceitou a proposta no app · venda ganha'); S.notifs.unshift({ id: 'n' + Date.now(), t: 'Proposta aceita no app!', s: 'Roma e Florença · Família Rodrigues', nova: true, go: ['negocio', n.id], e: 'party' }); marcar('p7'); S.modal = { tipo: 'ganho', id: n.id }; render(); },
  proxPassos: (d) => set({ modal: { tipo: 'ganho', id: d.id } }),
  criarViagem: (d) => { const n = neg(d.id); const C = propCalc(S.prop); S.viagens.unshift({ id: 'V-40', titulo: 'Roma e Florença · Família Rodrigues', ida: '13/11/2026', volta: '18/11/2026', emb: 'emissoes', pessoas: 4, valor: C.venda, app: true, vouchers: {}, despesas: [], check: [{ t: 'Emitir bilhetes aéreos (4)', ok: false }, { t: 'Passaportes válidos (4 de 4)', ok: true }, { t: 'Seguro viagem emitido', ok: false }, { t: 'Reservar ingresso Coliseu · 13/11 09:00', ok: false }, { t: 'Reservar aula de massa · 14/11 10:30', ok: false }, { t: 'Entrada recebida (30%)', ok: true }] }); S.modal = null; ativ(n.id, 'agora', 'Viagem criada e enviada para a sala de embarque'); toast('Viagem criada: roteiro, vouchers e despesas agora aparecem no app'); go('embarque'); },
  check: (d) => { const v = via(d.id); v.check[+d.v].ok = !v.check[+d.v].ok; if (v.id === 'V-40' && v.check.every((c) => c.ok)) marcar('p8'); render(); },
  avancarEmb: (d) => { const v = via(d.id); const ok = v.check.every((c) => c.ok); if (!ok) { toast('Conclua o checklist antes de avançar'); return; } const i = EMB.findIndex((e) => e.id === v.emb); v.emb = EMB[i + 1].id; if (v.id === 'V-40') marcar('p8'); v.check = v.check.map((c) => ({ ...c })); render(); toast(v.titulo + ' → ' + EMB[i + 1].nome); },
  voucher: (d) => { const v = via(d.id); v.vouchers[d.v] = true; render(); toast('Voucher anexado: o grupo já vê no app'); },
  partD: (d) => { const f = S.form || { desc: '', valor: '', moeda: 'EUR', pagou: 0, part: [true, true, true, true] }; f.part[+d.v] = !f.part[+d.v]; S.form = f; render(); },
  lancarD: (d) => {
    const v = via(d.id); const f = S.form || {}; const val = parseFloat(String(f.valor || '').replace(',', '.'));
    if (!f.desc || !(val > 0)) { toast('Preencha descrição e valor'); return; }
    if (!(f.part || []).some(Boolean)) { toast('Escolha pelo menos 1 pessoa'); return; }
    v.despesas.push({ desc: f.desc, valor: val, moeda: f.moeda || 'EUR', pagou: +f.pagou || 0, part: f.part.slice(), e: 'receipt' });
    S.form = null; marcar('p9'); render(); toast('Despesa lançada: o grupo recebeu o aviso "a agência adicionou uma despesa"');
  },
  simFim: () => {
    const v = via('V-40'); v.emb = 'concluida';
    S.avals.unshift({ q: 'Família Rodrigues', n: 5, t: 'Roteiro exatamente como votamos no app e tudo resolvido pelo app até o acerto final.', d: 'nov/2026', nova: true });
    S.leads.unshift({ id: 'L-1051', status: 'novo', recompra: true, recebido: 'Agora', prazo: 'Responder até amanhã', urg: false, origem: 'app', titulo: 'Próxima viagem · destino em escolha', pais: 'A definir', cidades: [], ida: 'a definir', volta: 'a definir', dias: 0, noites: 0, partida: 'São Paulo (GRU)', tipo: 'Família', valorEst: 32000, precoLead: 0, foto: '', contato: { nome: 'Flávio Rodrigues', email: 'flavio@email.com', tel: '(11) 98888-7777' }, pessoas: lead('L-1042').pessoas, leitura: 'Custo-benefício', alerta: 'Recompra: sem custo de lead (exemplo)', match: [{ g: 'Gastronomia', p: 82, emo: 'food' }], votos: [], roteiro: [] });
    S.recompra = true;
    S.notifs.unshift({ id: 'n' + Date.now(), t: 'Nova avaliação: 5 estrelas', s: 'Família Rodrigues avaliou a agência no app', nova: true, go: ['reputacao', ''], e: 'star' });
    S.notifs.unshift({ id: 'n' + (Date.now() + 1), t: 'Recompra: Família Rodrigues quer viajar de novo', s: 'Lead da próxima viagem, com o mesmo grupo', nova: true, go: ['lead', 'L-1051'], e: 'restore' });
    marcar('p10'); go('reputacao'); toast('Viagem quitada no app: chegaram a avaliação e o lead da próxima viagem');
  },
  exclD: (d) => { const v = via(d.id); const x = v.despesas.splice(+d.v, 1)[0]; render(); toast('Despesa "' + x.desc + '" excluída: o grupo foi avisado no app'); },
  feitoT: (d) => { const t = S.tarefas.find((x) => x.id === d.id); t.feito = !t.feito; render(); }
};

/* ---------- modais ---------- */
function modal() {
  const M = S.modal; if (!M) return '';
  let c = '';
  if (M === 'criar') c = `<h2 style="font-size:20px">Criar</h2><p class="muted">No produto, você cria negócio, cliente, tarefa ou proposta manualmente. Neste protótipo, a jornada principal começa por um lead que o grupo gerou no app.</p><div class="row" style="margin-top:14px;flex-wrap:wrap"><button class="btn p" data-a="go" data-t="leads">Ver leads do app</button><button class="btn" data-a="fechar">Fechar</button></div>`;
  if (M.tipo === 'recusar') c = `<h2 style="font-size:20px">Recusar o lead?</h2><p class="muted">O grupo é avisado no app e pode escolher outra agência. Nada é cobrado.</p><label class="f">Motivo<select class="inp"><option>Sem disponibilidade nas datas</option><option>Destino fora da nossa especialidade</option><option>Outro</option></select></label><div class="row" style="margin-top:14px;justify-content:flex-end"><button class="btn" data-a="fechar">Cancelar</button><button class="btn dg" data-a="confRecusar" data-id="${M.id}">Recusar lead</button></div>`;
  if (M.tipo === 'ganho') c = `<div style="text-align:center">${ic('party', 64, 'margin:0 auto')}<h2 style="font-size:22px;margin-top:8px">Venda ganha!</h2><p class="muted">O cabeça do grupo aceitou a proposta no app. Próximos passos:</p></div>
    <div class="ativ"><span class="h">1</span><div><b>Criar a viagem</b> a partir da proposta (roteiro, voos, hotéis e preços).</div></div><div class="ativ"><span class="h">2</span><div><b>Enviar para a sala de embarque</b> com o checklist de emissões, documentos e reservas.</div></div><div class="ativ"><span class="h">3</span><div><b>Lançar despesas do grupo</b>, que aparecem no app.</div></div>
    <div class="row" style="margin-top:14px;justify-content:flex-end"><button class="btn" data-a="fechar">Depois</button><button class="btn p" data-a="criarViagem" data-id="${M.id}">Criar viagem e enviar para embarque</button></div>`;
  return `<div class="ov" data-a="fecharFora"><div class="modal" role="dialog" aria-modal="true">${c}</div></div>`;
}

/* ============================== RENDER ============================== */
const TELAS = { inicio: telaInicio, leads: telaLeads, lead: telaLead, pipeline: telaPipeline, negocio: telaNegocio, propostas: telaPropostas, editor: telaEditor, viagens: telaViagens, viagem: telaViagem, embarque: telaEmbarque, despesas: telaDespesas, metas: telaMetas, clientes: telaClientes, tarefas: telaTarefas, reputacao: telaReputacao };
function render() {
  const sy = window.scrollY;
  document.getElementById('root').innerHTML = `<div class="app ${S.guia ? 'guia-on' : ''}">${side()}<main class="main"><div class="aviso-pc">Este protótipo foi feito para computador. No celular dá para navegar, mas a experiência completa é numa tela maior.</div>${barraTopo()}<div class="content">${(TELAS[S.tela] || telaInicio)()}</div></main>${S.guia ? guia() : ''}</div>${modal()}${S.toast ? `<div class="toast" role="status">${esc(S.toast)}</div>` : ''}`;
  window.scrollTo(0, sy);
}
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-a]'); if (!el) { if (S.notifOn && !e.target.closest('.notif')) set({ notifOn: false }); return; }
  const a = el.dataset.a;
  if (a === 'fecharFora') { if (e.target === el) set({ modal: null }); return; }
  if (ACT[a]) { if (el.tagName !== 'INPUT') e.preventDefault(); ACT[a](el.dataset); }
});
document.addEventListener('keydown', (e) => { if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('kcard')) { e.preventDefault(); e.target.click(); } if (e.key === 'Escape' && S.modal) set({ modal: null }); });
document.addEventListener('input', (e) => {
  const t = e.target;
  if (t.dataset.f && S.prop) { S.prop[t.dataset.f] = t.type === 'number' ? +t.value : t.value; }
  if (t.dataset.f2) { S.form = S.form || { desc: '', valor: '', moeda: 'EUR', pagou: 0, part: [true, true, true, true] }; S.form[t.dataset.f2] = t.value; }
});
document.addEventListener('change', (e) => { const t = e.target; if (t.dataset.f && S.prop && t.type === 'number') render(); if (t.dataset.f2 && t.tagName === 'SELECT') render(); });
marcar('p1');
render();
</script>
</body>
</html>
